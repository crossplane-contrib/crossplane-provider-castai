    castai_pod_mutation:
        subCategory: ""
        description: CAST AI pod mutation resource allows managing pod mutations for Kubernetes workloads.
        name: castai_pod_mutation
        title: castai_pod_mutation Resource - terraform-provider-castai
        examples:
            - name: spot_scheduling
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "kinds": [
                            {
                              "type": "EXACT",
                              "value": "Deployment"
                            }
                          ],
                          "namespaces": [
                            {
                              "type": "EXACT",
                              "value": "default"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "spot-scheduling",
                  "spot_config": [
                    {
                      "distribution_percentage": 80,
                      "spot_mode": "PREFERRED_SPOT"
                    }
                  ],
                  "tolerations": [
                    {
                      "effect": "NoSchedule",
                      "key": "scheduling.cast.ai/spot",
                      "operator": "Exists"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: spot_all_except_system
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "exclude_namespaces": [
                            {
                              "type": "EXACT",
                              "value": "kube-system"
                            },
                            {
                              "type": "EXACT",
                              "value": "castai-agent"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "spot-all-except-system",
                  "spot_config": [
                    {
                      "distribution_percentage": 100,
                      "spot_mode": "USE_ONLY_SPOT"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: spot_exclude_infra
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "exclude_kinds": [
                            {
                              "type": "EXACT",
                              "value": "DaemonSet"
                            },
                            {
                              "type": "EXACT",
                              "value": "StatefulSet"
                            }
                          ],
                          "exclude_names": [
                            {
                              "type": "EXACT",
                              "value": "castai-agent"
                            },
                            {
                              "type": "EXACT",
                              "value": "castai-cluster-controller"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "spot-exclude-infra",
                  "spot_config": [
                    {
                      "distribution_percentage": 100,
                      "spot_mode": "USE_ONLY_SPOT"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: dedicated_nodes_by_name
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "names": [
                            {
                              "type": "EXACT",
                              "value": "my-redis-cluster-prod"
                            },
                            {
                              "type": "EXACT",
                              "value": "my-redis-cache-prod"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "dedicated-nodes-by-name",
                  "node_selector": [
                    {
                      "add": {
                        "dedicated": "redis"
                      }
                    }
                  ],
                  "tolerations": [
                    {
                      "effect": "NoSchedule",
                      "key": "dedicated",
                      "operator": "Equal",
                      "value": "redis"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: rollouts_node_template
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "exclude_namespaces": [
                            {
                              "type": "EXACT",
                              "value": "infra"
                            },
                            {
                              "type": "EXACT",
                              "value": "monitoring"
                            }
                          ],
                          "kinds": [
                            {
                              "type": "EXACT",
                              "value": "Rollout"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "rollouts-node-template",
                  "node_templates_to_consolidate": [
                    "default-by-castai"
                  ],
                  "spot_config": [
                    {
                      "distribution_percentage": 100,
                      "spot_mode": "PREFERRED_SPOT"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: spot_with_affinity
              manifest: |-
                {
                  "affinity": [
                    {
                      "node_affinity": [
                        {
                          "preferred_during_scheduling_ignored_during_execution": [
                            {
                              "preference": [
                                {
                                  "match_expressions": [
                                    {
                                      "key": "topology.kubernetes.io/zone",
                                      "operator": "In",
                                      "values": [
                                        "us-east-1a",
                                        "us-east-1b"
                                      ]
                                    }
                                  ]
                                }
                              ],
                              "weight": 1
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "kinds": [
                            {
                              "type": "EXACT",
                              "value": "Deployment"
                            }
                          ],
                          "namespaces": [
                            {
                              "type": "EXACT",
                              "value": "default"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "spot-with-affinity",
                  "spot_config": [
                    {
                      "distribution_percentage": 100,
                      "spot_mode": "PREFERRED_SPOT"
                    }
                  ],
                  "tolerations": [
                    {
                      "effect": "NoSchedule",
                      "key": "scheduling.cast.ai/spot",
                      "operator": "Exists"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: json_patches
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "exclude_names": [
                            {
                              "type": "EXACT",
                              "value": "web-internal"
                            }
                          ],
                          "names": [
                            {
                              "type": "REGEX",
                              "value": "^web-.*$"
                            }
                          ],
                          "namespaces": [
                            {
                              "type": "EXACT",
                              "value": "default"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "json-patches",
                  "patch": "${jsonencode([\n    {\n      op    = \"add\"\n      path  = \"/metadata/annotations/mutated-by\"\n      value = \"castai\"\n    },\n    {\n      op    = \"add\"\n      path  = \"/spec/containers/0/resources/limits/memory\"\n      value = \"512Mi\"\n    },\n  ])}"
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: multi_pool_distribution
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "distribution_groups": [
                    {
                      "configuration": [
                        {
                          "node_selector": [
                            {
                              "add": {
                                "node.kubernetes.io/gpu": "true"
                              }
                            }
                          ],
                          "spot_type": "PREFERRED_SPOT",
                          "tolerations": [
                            {
                              "effect": "NoSchedule",
                              "key": "nvidia.com/gpu",
                              "operator": "Exists"
                            }
                          ]
                        }
                      ],
                      "name": "gpu-pool",
                      "percentage": 30
                    },
                    {
                      "configuration": [
                        {
                          "node_templates_to_consolidate": [
                            "default-general"
                          ],
                          "spot_type": "OPTIONAL_SPOT"
                        }
                      ],
                      "name": "general-pool",
                      "percentage": 70
                    }
                  ],
                  "enabled": true,
                  "filter_v2": [
                    {
                      "pod": [
                        {
                          "labels_filter": [
                            {
                              "matchers": [
                                {
                                  "key": [
                                    {
                                      "type": "EXACT",
                                      "value": "app"
                                    }
                                  ],
                                  "value": [
                                    {
                                      "type": "EXACT",
                                      "value": "web"
                                    }
                                  ]
                                }
                              ],
                              "operator": "AND"
                            }
                          ]
                        }
                      ],
                      "workload": [
                        {
                          "exclude_namespaces": [
                            {
                              "type": "EXACT",
                              "value": "prod-legacy"
                            }
                          ],
                          "namespaces": [
                            {
                              "type": "REGEX",
                              "value": "^prod-.*$"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "multi-pool-distribution"
                }
              references:
                cluster_id: castai_eks_cluster.example.id
            - name: enforce_with_eviction
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "enabled": true,
                  "filter_v2": [
                    {
                      "workload": [
                        {
                          "kinds": [
                            {
                              "type": "EXACT",
                              "value": "Deployment"
                            }
                          ],
                          "namespaces": [
                            {
                              "type": "EXACT",
                              "value": "production"
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  "name": "enforce-spot-with-eviction",
                  "pod_eviction": [
                    {
                      "enabled": true
                    }
                  ],
                  "spot_config": [
                    {
                      "distribution_percentage": 100,
                      "spot_mode": "USE_ONLY_SPOT"
                    }
                  ],
                  "tolerations": [
                    {
                      "effect": "NoSchedule",
                      "key": "scheduling.cast.ai/spot",
                      "operator": "Exists"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
        argumentDocs:
            add: (Map of String)
            affinity: '(Block List, Max: 1) Affinity to apply to the pods. (see below for nested schema)'
            annotations: (Map of String) Annotations to add to the pods.
            cluster_id: (String) ID of the cluster.
            configuration: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            distribution_groups: (Block List) Distribution groups for percentage-based pod distribution. (see below for nested schema)
            distribution_percentage: (Number) Percentage of pods (0-100) that receive spot scheduling constraints.
            effect: (String) Toleration effect.
            enabled: (Boolean) Whether the pod mutation is enabled.
            exclude_kinds: (Block Set) (see below for nested schema)
            exclude_labels_filter: '(Block List, Max: 1) (see below for nested schema)'
            exclude_names: (Block Set) (see below for nested schema)
            exclude_namespaces: (Block Set) (see below for nested schema)
            filter_v2: '(Block List, Min: 1, Max: 1) Advanced object filter with support for exact and regex matching. (see below for nested schema)'
            id: (String) The ID of this resource.
            key: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            kinds: (Block Set) (see below for nested schema)
            labels: (Map of String) Labels to add to the pods.
            labels_filter: '(Block List, Max: 1) (see below for nested schema)'
            match_expressions: (Block List) (see below for nested schema)
            matchers: '(Block Set, Min: 1) (see below for nested schema)'
            name: (String) Name of the pod mutation.
            names: (Block Set) (see below for nested schema)
            namespaces: (Block Set) (see below for nested schema)
            node_affinity: '(Block List, Max: 1) (see below for nested schema)'
            node_selector: '(Block List, Max: 1) Node selector to apply to the pods (add/remove key-value pairs). (see below for nested schema)'
            node_templates_to_consolidate: (List of String) Node template names to consolidate.
            operator: '(String) Logical operator to combine label matchers: AND or OR.'
            organization_id: (String) ID of the organization. If not provided, will be inferred from the API client.
            patch: (String) JSON patch to apply to pods. Must be a JSON array of patch operations.
            percentage: (Number) Percentage of pods (0-100) that should receive this configuration.
            pod: '(Block List, Max: 1) Pod filter for labels. (see below for nested schema)'
            pod_eviction: '(Block List, Max: 1) Eviction settings for enforcement of pod mutations. (see below for nested schema)'
            preference: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            preferred_during_scheduling_ignored_during_execution: (Block List) (see below for nested schema)
            remove: (Map of String)
            source: (String) Source of the pod mutation (API or CUSTOM_RESOURCE).
            spot_config: '(Block List, Max: 1) Spot configuration for the mutation. (see below for nested schema)'
            spot_mode: '(String) Spot mode: OPTIONAL_SPOT, USE_ONLY_SPOT, or PREFERRED_SPOT.'
            spot_type: '(String) Spot instance type: OPTIONAL_SPOT, USE_ONLY_SPOT, or PREFERRED_SPOT.'
            toleration_seconds: (Number) Toleration seconds.
            tolerations: (Block List) Tolerations to apply to the pods. (see below for nested schema)
            tolerations_filter: '(Block List, Max: 1) Tolerations filter for matching pods by their tolerations. (see below for nested schema)'
            type: '(String) Matcher type: EXACT or REGEX.'
            value: '(Block List, Max: 1) (see below for nested schema)'
            values: (List of String)
            weight: (Number) Weight of the node affinity term.
            workload: '(Block List, Max: 1) Workload filter for kinds, names, and namespaces. (see below for nested schema)'
        importStatements: []
    castai_rebalancing_job:
        subCategory: ""
        description: Job assigns a rebalancing schedule to a cluster.
        name: castai_rebalancing_job
        title: castai_rebalancing_job Resource - terraform-provider-castai
        examples:
            - name: spots
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.test.id}",
                  "enabled": true,
                  "rebalancing_schedule_id": "${castai_rebalancing_schedule.spots.id}"
                }
              references:
                cluster_id: castai_eks_cluster.test.id
                rebalancing_schedule_id: castai_rebalancing_schedule.spots.id
        argumentDocs:
            cluster_id: (String) CAST AI cluster id.
            create: (String)
            delete: (String)
            enabled: (Boolean) The job will only be executed if it's enabled.
            id: (String) The ID of this resource.
            read: (String)
            rebalancing_schedule_id: (String) Rebalancing schedule of this job.
            timeouts: (Block, Optional) (see below for nested schema)
            update: (String)
        importStatements:
            - |-
              # Import jobs by specifying cluster ID and schedule name.
              # Schedule must be assigned to the cluster already for this command to succeed.
              terraform import 'castai_rebalancing_job.spots' 12345678-1762-45eb-bd4f-85cb172e6ad3/spots
    castai_rebalancing_schedule:
        subCategory: ""
        description: CAST AI rebalancing schedule resource to manage rebalancing schedules.
        name: castai_rebalancing_schedule
        title: castai_rebalancing_schedule Resource - terraform-provider-castai
        examples:
            - name: spots
              manifest: |-
                {
                  "launch_configuration": [
                    {
                      "aggressive_mode_config": [
                        {
                          "ignore_local_persistent_volumes": false,
                          "ignore_problem_job_pods": false,
                          "ignore_problem_pods_without_controller": true,
                          "ignore_problem_removal_disabled_pods": false
                        }
                      ],
                      "execution_conditions": [
                        {
                          "achieved_savings_percentage": 10,
                          "enabled": true
                        }
                      ],
                      "keep_drain_timeout_nodes": false,
                      "node_ttl_seconds": 300,
                      "num_targeted_nodes": 3,
                      "rebalancing_min_nodes": 2,
                      "selector": "${jsonencode({\n      nodeSelectorTerms = [{\n        matchExpressions = [\n          {\n            key      = \"scheduling.cast.ai/spot\"\n            operator = \"Exists\"\n          }\n        ]\n      }]\n    })}"
                    }
                  ],
                  "name": "rebalance spots at every 30th minute",
                  "schedule": [
                    {
                      "cron": "*/30 * * * *"
                    }
                  ],
                  "trigger_conditions": [
                    {
                      "savings_percentage": 20
                    }
                  ]
                }
        argumentDocs:
            CRON_TZ: variable is set to "America/New_York" indicating that the cron expression should be interpreted in the Eastern Time (ET) timezone.
            achieved_savings_percentage: (Number) The percentage of the predicted savings that must be achieved in order to fully execute the plan.If the savings are not achieved after creating the new nodes, the plan will fail and delete the created nodes.
            aggressive_mode: (Boolean) When enabled, rebalancing considers all problematic pods (pods without controller, job pods, pods with removal-disabled annotation) as not-problematic.
            aggressive_mode_config: '(Block List, Max: 1) Advanced configuration for the aggressive rebalancing mode. This is the recommended way to configure aggressive rebalancing. Please keep the aggressive_mode parameter unset or set it aggressive_mode=false before using this config option. When the legacy aggressive_mode is set to true, it takes precedence over this option. (see below for nested schema)'
            create: (String)
            cron: (String) Cron expression defining when the schedule should trigger.
            delete: (String)
            enabled: (Boolean) Enables or disables the execution conditions.
            execution_conditions: '(Block List, Max: 1) (see below for nested schema)'
            id: (String) The ID of this resource.
            ignore_local_persistent_volumes: (Boolean) Rebalance workloads that use local-path Persistent Volumes. THIS WILL RESULT IN DATA LOSS.
            ignore_problem_job_pods: '(Boolean) Pods spawned by Jobs or CronJobs will not prevent the Rebalancer from deleting a node on which they run. WARNING: When true, pods spawned by Jobs or CronJobs will be terminated if the Rebalancer picks a node that runs them. As such, they are likely to lose their progress.'
            ignore_problem_pods_without_controller: '(Boolean) Pods that don''t have a controller (bare pods) will not prevent the Rebalancer from deleting a node on which they run. WARNING: When true, such pods might not restart, since they have no controller to do it.'
            ignore_problem_removal_disabled_pods: '(Boolean) Pods that are marked with "removal disabled" will not prevent the Rebalancer from deleting a node on which they run. WARNING: When true, such pods will be evicted and disrupted.'
            ignore_savings: (Boolean) If true, the savings percentage will be ignored and the rebalancing will be triggered regardless of the savings percentage.
            keep_drain_timeout_nodes: (Boolean) Defines whether the nodes that failed to get drained until a predefined timeout, will be kept with a rebalancing.cast.ai/status=drain-failed annotation instead of forcefully drained.
            launch_configuration: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            name: (String) Name of the schedule.
            node_ttl_seconds: (Number) Specifies amount of time since node creation before the node is allowed to be considered for automated rebalancing.
            num_targeted_nodes: (Number) Maximum number of nodes that will be selected for rebalancing.
            read: (String)
            rebalancing_min_nodes: (Number) Minimum number of nodes that should be kept in the cluster after rebalancing.
            savings_percentage: (Number) Defines the minimum percentage of savings expected.
            schedule: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            selector: (String) Node selector in JSON format.
            target_node_selection_algorithm: (String) Defines the algorithm used to select the target nodes for rebalancing.
            timeouts: (Block, Optional) (see below for nested schema)
            trigger_conditions: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            update: (String)
        importStatements:
            - |-
              # Associate terraform resource "spots" with a rebalancing schedule named "spots".
              terraform import 'castai_rebalancing_schedule.spots' spots

              # Importing via direct schedule ID is also possible.
              terraform import 'castai_rebalancing_schedule.spots' b4e69e0c-1762-45eb-bd4f-85cb172e6ad3
