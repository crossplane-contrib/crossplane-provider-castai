    castai_edge_location:
        subCategory: ""
        description: Manage CAST AI Edge Location for edge computing deployments
        name: castai_edge_location
        title: castai_edge_location Resource - terraform-provider-castai
        examples:
            - name: aws_example
              manifest: |-
                {
                  "aws": {
                    "access_key_id_wo": "AKIAIOSFODNN7EXAMPLE",
                    "account_id": "123456789012",
                    "name_tag": "castai-edge-location",
                    "secret_access_key_wo": "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY",
                    "security_group_id": "sg-12345678",
                    "subnet_ids": {
                      "us-east-1a": "subnet-12345678",
                      "us-east-1b": "subnet-87654321"
                    },
                    "vpc_id": "vpc-12345678"
                  },
                  "cluster_id": "${castai_omni_cluster.example.id}",
                  "description": "AWS edge location in us-east-1",
                  "name": "aws-edge-us-east",
                  "organization_id": "your-org-id",
                  "region": "us-east-1",
                  "zones": [
                    {
                      "id": "us-east-1a",
                      "name": "us-east-1a"
                    },
                    {
                      "id": "us-east-1b",
                      "name": "us-east-1b"
                    }
                  ]
                }
              references:
                cluster_id: castai_omni_cluster.example.id
        argumentDocs:
            access_key_id_wo: (String, Sensitive) AWS access key ID
            account_id: (String) AWS account ID
            aws: (Attributes) AWS configuration for the edge location (see below for nested schema)
            client_service_account_json_base64_wo: (String, Sensitive) Base64 encoded service account JSON for provisioning edge resources
            cluster_id: (String) CAST AI cluster ID
            cni: (Attributes) CNI (kube-router) configuration for the edge cluster. (see below for nested schema)
            compartment_id: (String) OCI compartment ID of edge location
            control_plane: (Attributes) Control plane configuration. Only valid when control_plane_mode is SHARED. (see below for nested schema)
            control_plane_mode: '(String) The mode of control plane inside edge location. Valid values: DEDICATED, SHARED.'
            credentials_revision: (Number) Revision number incremented each time credentials change
            custom: (Attributes) Custom cloud provider configuration for the edge location (see below for nested schema)
            description: (String) Description of the edge location
            fingerprint_wo: (String, Sensitive) API key fingerprint
            gcp: (Attributes) GCP configuration for the edge location (see below for nested schema)
            ha: (Boolean) Whether to use HA mode for control plane. If not set, default is HA.
            id: (String) Edge location ID
            instance_profile: (String) AWS IAM instance profile ARN to be attached to edge instances. It can be used to grant permissions to access other AWS resources such as ECR.
            instance_service_account: (String) GCP service account email to be attached to edge instances. It can be used to grant permissions to access other GCP resources.
            name: (String) Name of the edge location. Must be unique and relatively short as it's used for creating service accounts.
            name_tag: (String, Deprecated) The value of a 'Name' tag applied to VPC resources
            network_name: (String) The name of the network to be used in the selected region
            network_tags: (Set of String) Tags applied on the provisioned cloud resources and the firewall rule
            networking: (Attributes) Edge cluster networking configuration. (see below for nested schema)
            oci: (Attributes) OCI configuration for the edge location (see below for nested schema)
            organization_id: (String) CAST AI organization ID
            overlay: '(String) Overlay mode for kube-router pod-to-pod traffic. Valid values: OVERLAY_UNSPECIFIED, OVERLAY_OFF, OVERLAY_SUBNET, OVERLAY_FULL.'
            overlay_encap: '(String) Encapsulation protocol used by the overlay. Valid values: OVERLAY_ENCAP_UNSPECIFIED, OVERLAY_ENCAP_IPIP, OVERLAY_ENCAP_FOU.'
            private_key_base64_wo: (String, Sensitive) Base64 encoded API private key
            project_id: (String) GCP project ID where edges run
            region: (String) The region where the edge location is deployed. Required for AWS, GCP and OCI providers.
            role_arn: (String) AWS IAM role ARN used for Google OIDC federation impersonation
            secret_access_key_wo: (String, Sensitive) AWS secret access key
            security_group_id: (String) Security group ID to be used in the selected region
            subnet_cidr: (String) VPC Subnet IPv4 CIDR block
            subnet_id: (String) OCI subnet ID of edge location
            subnet_ids: (Map of String) Map of zone names to subnet IDs to be used in the selected region
            subnet_name: (String) The name of the subnetwork to be used in the selected region
            target_service_account_email: (String) Target service account email to be used for impersonation
            tenancy_id: (String) OCI tenancy ID of the account
            tunneled_cidrs: (List of String) List of destination CIDR blocks whose traffic should be routed through the main cluster instead of directly from the edge cluster.
            user_id_wo: (String) User ID used to authenticate OCI
            vcn_cidr: (String) OCI VCN IPv4 CIDR block
            vcn_id: (String) OCI virtual cloud network ID
            vpc_cidr: (String) VPC IPv4 CIDR block
            vpc_id: (String) VPC ID to be used in the selected region
            vpc_peered: (Boolean) Whether existing VPC is peered with main cluster's VPC. Field is ignored if vpc_id is not provided or main cluster is not EKS
            zones: (Attributes List) List of availability zones for the edge location (see below for nested schema)
        importStatements:
            - |-
              # Import edge location using organization_id/cluster_id/edge_location_id format
              terraform import castai_edge_location.example "8c02f119-993c-4cce-8bff-4df50798514a/a1b2c3d4-e5f6-7890-abcd-ef1234567890/b2c3d4e5-f6a7-8901-bcde-f12345678901"
    castai_eks_cluster:
