name: castai/castai
resources:
    castai_ai_optimizer_hosted_model:
        subCategory: ""
        name: castai_ai_optimizer_hosted_model
        title: castai_ai_optimizer_hosted_model Resource - terraform-provider-castai
        examples:
            - name: hf_example
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "horizontal_autoscaling": [
                    {
                      "enabled": true,
                      "max_replicas": 4,
                      "min_replicas": 1,
                      "target_metric": "NUMBER_OF_REQUESTS_WAITING",
                      "target_value": 10
                    }
                  ],
                  "model_specs_id": "${castai_ai_optimizer_model_specs.hf_example.id}",
                  "port": 8080,
                  "service": "llama31",
                  "vllm_config": [
                    {
                      "secret_name": "huggingface-token"
                    }
                  ]
                }
              references:
                cluster_id: castai_eks_cluster.example.id
                model_specs_id: castai_ai_optimizer_model_specs.hf_example.id
            - name: private_example
              manifest: |-
                {
                  "cluster_id": "${castai_eks_cluster.example.id}",
                  "model_specs_id": "${castai_ai_optimizer_model_specs.private_example.id}",
                  "port": 8080,
                  "service": "custom-model"
                }
              references:
                cluster_id: castai_eks_cluster.example.id
                model_specs_id: castai_ai_optimizer_model_specs.private_example.id
        argumentDocs:
            cloud_provider: (String) Cloud provider.
            cluster_id: (String) CAST AI cluster ID where the model will be deployed.
            current_replicas: (Number) Current number of replicas.
            duration: (String) Time period for the condition evaluation.
            edge_location_ids: (List of String) List of edge location IDs where the model can be deployed.
            enabled: (Boolean)
            fallback: '(Block List, Max: 1) Fallback model settings. (see below for nested schema)'
            hibernate_condition: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            hibernation: '(Block List, Max: 1) Automatic hibernation settings. (see below for nested schema)'
            horizontal_autoscaling: '(Block List, Max: 1) Horizontal autoscaling settings. (see below for nested schema)'
            hugging_face_token: (String, Sensitive) HuggingFace token. Mutually exclusive with secret_name.
            id: (String) The ID of this resource.
            max_replicas: (Number)
            min_replicas: (Number)
            model: (String)
            model_specs_id: (String) ID of the model specs. Can reference a castai_ai_optimizer_model_specs resource or a pre-existing model specs ID for predefined (CastAI-managed) models.
            namespace: (String) Kubernetes namespace.
            node_template_name: (String) Node template name for model deployment.
            port: (Number) Port on which the model will be exposed.
            provider_id: (String)
            region: (String) Region the model is deployed in.
            request_count: (Number) Request count threshold. Value of 0 is treated as not set.
            resume_condition: '(Block List, Min: 1, Max: 1) (see below for nested schema)'
            secret_name: (String) Kubernetes secret name containing the HuggingFace token.
            service: (String) Kubernetes service name for the deployed model.
            status: (String) Hosted model status.
            status_reason: (String) Reason for the current status.
            target_metric: (String)
            target_value: (Number)
            vllm_config: '(Block List, Max: 1) vLLM configuration for HuggingFace models. (see below for nested schema)'
        importStatements: []
    castai_ai_optimizer_model_registry:
        subCategory: ""
        name: castai_ai_optimizer_model_registry
        title: castai_ai_optimizer_model_registry Resource - terraform-provider-castai
        examples:
            - name: example
              manifest: |-
                {
                  "credentials": "${var.registry_credentials}",
                  "provider_type": "S3",
                  "s3": [
                    {
                      "bucket": "my-company-model-registry",
                      "prefix": "models/",
                      "region": "us-east-1"
                    }
                  ]
                }
              references:
                credentials: var.registry_credentials
        argumentDocs:
            bucket: (String) GCS bucket name.
            credentials: (String, Sensitive) JSON-encoded credentials for accessing the bucket.
            gcs: '(Block List, Max: 1) Google Cloud Storage provider configuration. Required when provider_type is GCS. (see below for nested schema)'
            id: (String) The ID of this resource.
            prefix: (String) Path prefix within the bucket.
            provider_type: '(String) Provider type: S3 or GCS.'
            region: (String) AWS region of the S3 bucket.
            s3: '(Block List, Max: 1) AWS S3 provider configuration. Required when provider_type is S3. (see below for nested schema)'
            service_account: (String) Service account email generated by onboarding.
            status: (String) Registry status.
            status_reason: (String) Reason for the current status.
            user_name: (String) IAM user name created by onboarding.
        importStatements: []
    castai_ai_optimizer_model_specs:
        subCategory: ""
        name: castai_ai_optimizer_model_specs
        title: castai_ai_optimizer_model_specs Resource - terraform-provider-castai
        examples:
            - name: hf_example
              manifest: |-
                {
                  "huggingface": [
                    {
                      "model_name": "meta-llama/Llama-3.1-8B-Instruct"
                    }
                  ],
                  "model": "llama-3.1-8b-instruct",
                  "registry_type": "HUGGING_FACE",
                  "routable": true,
                  "type": "chat"
                }
            - name: private_example
              manifest: |-
                {
                  "model": "my-custom-model",
                  "private_registry": [
                    {
                      "base_model_id": "my-custom-model",
                      "registry_id": "${castai_ai_optimizer_model_registry.example.id}"
                    }
                  ],
                  "registry_type": "PRIVATE"
                }
              references:
                private_registry.registry_id: castai_ai_optimizer_model_registry.example.id
        argumentDocs:
            base_model_id: (String) Base model identifier.
            description: (String) Model description.
            huggingface: '(Block List, Max: 1) HuggingFace registry configuration. Required when registry_type is HUGGING_FACE. (see below for nested schema)'
            id: (String) The ID of this resource.
            model: (String) Model name.
            model_name: (String) HuggingFace model name (e.g. meta-llama/Llama-3.1-8B-Instruct).
            private_registry: '(Block List, Max: 1) Private registry configuration. Required when registry_type is PRIVATE. (see below for nested schema)'
            registry_id: (String) ID of the castai_ai_optimizer_model_registry resource.
            registry_type: '(String) Registry type: HUGGING_FACE or PRIVATE.'
            routable: (Boolean) Whether the model is routable.
            type: (String) Model type (chat, embeddings, completion, etc.).
        importStatements: []
    castai_aks_cluster:
        subCategory: ""
        description: AKS cluster resource allows connecting an existing AKS cluster to CAST AI.
        name: castai_aks_cluster
        title: castai_aks_cluster Resource - terraform-provider-castai
        examples:
            - name: this
              manifest: |-
                {
                  "client_id": "${azuread_application.castai.application_id}",
                  "client_secret": "${azuread_application_password.castai.value}",
                  "delete_nodes_on_disconnect": "${var.delete_nodes_on_disconnect}",
                  "name": "${var.aks_cluster_name}",
                  "node_resource_group": "${azurerm_kubernetes_cluster.this.node_resource_group}",
                  "region": "${var.aks_cluster_region}",
                  "subscription_id": "${data.azurerm_subscription.current.subscription_id}",
                  "tenant_id": "${data.azurerm_subscription.current.tenant_id}"
                }
              references:
                client_id: azuread_application.castai.application_id
                client_secret: azuread_application_password.castai.value
                delete_nodes_on_disconnect: var.delete_nodes_on_disconnect
                name: var.aks_cluster_name
                node_resource_group: azurerm_kubernetes_cluster.this.node_resource_group
                region: var.aks_cluster_region
                subscription_id: data.azurerm_subscription.current.subscription_id
                tenant_id: data.azurerm_subscription.current.tenant_id
        argumentDocs:
            client_id: (String) Azure AD application ID that is created and used by CAST AI.
            client_secret: (String, Sensitive) Azure AD application password that will be used by CAST AI.
            cluster_token: (String, Sensitive) CAST AI cluster token.
            create: (String)
            credentials_id: (String) CAST AI internal credentials ID
            delete: (String)
            delete_nodes_on_disconnect: (Boolean) Should CAST AI remove nodes managed by CAST.AI on disconnect.
            federation_id: (String) Azure federation used by CAST AI for secretless auth via impersonation.
            http_proxy: (String) Address to use for proxying HTTP requests.
            http_proxy_config: '(Block List, Max: 1) HTTP proxy configuration for CAST AI nodes and node components. (see below for nested schema)'
            https_proxy: (String) Address to use for proxying HTTPS/TLS requests.
            id: (String) The ID of this resource.
            name: (String) AKS cluster name.
            no_proxy: (List of String) List of destinations that should not go through proxy.
            node_resource_group: (String) Azure resource group in which nodes are and will be created.
            organization_id: (String) CAST AI organization ID
            region: (String) AKS cluster region.
            subscription_id: (String) ID of the Azure subscription.
            tenant_id: (String) Azure AD tenant ID from the used subscription.
            timeouts: (Block, Optional) (see below for nested schema)
            update: (String)
        importStatements: []
    castai_allocation_group:
        subCategory: ""
        description: Manage allocation group. Allocation group reference https://docs.cast.ai/docs/allocation-groups
        name: castai_allocation_group
        title: castai_allocation_group Resource - terraform-provider-castai
        examples:
            - name: ag_example
              manifest: |-
                {
                  "cluster_ids": [
                    "1a58d6b4-bc0e-4417-b9c7-31d15c313f3f",
                    "d204b988-5db5-472e-a258-bf763a0f4a93"
                  ],
                  "labels": {
                    "app.kubernetes.io/name": "app-name",
                    "environment": "production",
                    "team": "my-team"
                  },
                  "labels_operator": "AND",
                  "name": "ag_example",
                  "namespaces": [
                    "namespace-a",
                    "namespace-b"
                  ]
                }
        argumentDocs:
            cluster_ids: (Set of String) List of CAST AI cluster ids
            id: (String) The ID of this resource.
            labels: (Map of String) Labels used to select workloads to track
            labels_operator: |-
                (String) Operator with which to connect the labels
                OR (default) - workload needs to have at least one label to be included
                AND - workload needs to have all the labels to be included
            name: (String) Allocation group name
            namespaces: (List of String) List of cluster namespaces to track
        importStatements:
            - |-
              # Importing via direct allocation group ID is also possible.
              # Will use the default organization ID, that is associated with the API token.
              terraform import 'castai_allocation_group.my_allocation_group' e5ee784d-2c4b-4820-ab4e-16e4b81534a4
    castai_autoscaler:
        subCategory: ""
        description: CAST AI autoscaler resource to manage autoscaler settings
        name: castai_autoscaler
        title: castai_autoscaler Resource - terraform-provider-castai
        examples:
            - name: castai_autoscaler_policy
              manifest: |-
                {
                  "autoscaler_settings": [
                    {
                      "cluster_limits": [
                        {
                          "cpu": [
                            {
                              "max_cores": 10,
                              "min_cores": 1
                            }
                          ],
                          "enabled": true
                        }
                      ],
                      "enabled": true,
                      "is_scoped_mode": false,
                      "node_downscaler": [
                        {
                          "empty_nodes": [
                            {
                              "delay_seconds": 90,
                              "enabled": true
                            }
                          ],
                          "enabled": true,
                          "evictor": [
                            {
                              "aggressive_mode": false,
                              "cycle_interval": "60s",
                              "dry_run": false,
                              "enabled": true,
                              "ignore_pod_disruption_budgets": false,
                              "node_grace_period_minutes": 10,
                              "pod_eviction_failure_back_off_interval": "30s",
                              "scoped_mode": false
                            }
                          ]
                        }
                      ],
                      "node_templates_partial_matching_enabled": false,
                      "unschedulable_pods": [
                        {
                          "enabled": true
                        }
                      ]
                    }
                  ],
                  "cluster_id": "${castai_eks_cluster.test.id}"
                }
              references:
                cluster_id: castai_eks_cluster.test.id
        argumentDocs:
            aggressive_mode: (Boolean) enable/disable aggressive mode. By default, Evictor does not target nodes that are running unreplicated pods. This mode will make the Evictor start considering application with just a single replica.
            autoscaler_policies: (String, Deprecated) computed value to store full policies configuration
            autoscaler_policies_json: (String, Deprecated) autoscaler policies JSON string to override current autoscaler settings
            autoscaler_settings: '(Block List, Max: 1) autoscaler policy definitions to override current autoscaler settings (see below for nested schema)'
            cluster_id: (String) CAST AI cluster id
            cluster_limits: '(Block List, Max: 1) defines minimum and maximum amount of CPU the cluster can have. (see below for nested schema)'
            cpu: '(Block List, Max: 1) defines the minimum and maximum amount of CPUs for cluster''s worker nodes. (see below for nested schema)'
            cpu_percentage: (Number) defines percentage of additional CPU capacity to be added.
            create: (String)
            custom_instances_enabled: (Boolean, Deprecated) enable/disable custom instances policy.
            cycle_interval: (String) configure the interval duration between Evictor operations. This property can be used to lower or raise the frequency of the Evictor's find-and-drain operations.
            delay_seconds: (Number) period (in seconds) to wait before removing the node. Might be useful to control the aggressiveness of the downscaler.
            dry_run: (Boolean) enable/disable dry-run. This property allows you to prevent the Evictor from carrying any operations out and preview the actions it would take.
            empty_nodes: '(Block List, Max: 1) defines whether Node Downscaler should opt in for removing empty worker nodes when possible. (see below for nested schema)'
            enabled: (Boolean) enable/disable autoscaler policies
            evictor: '(Block List, Max: 1) defines the CAST AI Evictor component settings. Evictor watches the pods running in your cluster and looks for ways to compact them into fewer nodes, making nodes empty, which will be removed by the empty worker nodes policy. (see below for nested schema)'
            headroom: '(Block List, Max: 1, Deprecated) additional headroom based on cluster''s total available capacity for on-demand nodes. (see below for nested schema)'
            headroom_spot: '(Block List, Max: 1, Deprecated) additional headroom based on cluster''s total available capacity for spot nodes. (see below for nested schema)'
            id: (String) The ID of this resource.
            ignore_pod_disruption_budgets: (Boolean) if enabled then Evictor will attempt to evict pods that have pod disruption budgets configured.
            is_scoped_mode: (Boolean) run autoscaler in scoped mode. Only marked pods and nodes will be considered.
            max_cores: (Number) defines the maximum allowed amount of vCPUs in the whole cluster.
            max_cpu_cores: (Number) defines max CPU cores for the node to pick.
            max_ram_mib: (Number) defines max RAM in MiB for the node to pick.
            max_reclaim_rate: (Number, Deprecated) max allowed reclaim rate when choosing spot instance type. E.g. if the value is 10%, instance types having 10% or higher reclaim rate will not be considered. Set to zero to use all instance types regardless of reclaim rate.
            memory_percentage: (Number) defines percentage of additional memory capacity to be added.
            min_cores: (Number) defines the minimum allowed amount of CPUs in the whole cluster.
            min_cpu_cores: (Number) defines min CPU cores for the node to pick.
            min_ram_mib: (Number) defines min RAM in MiB for the node to pick.
            node_constraints: '(Block List, Max: 1, Deprecated) defines the node constraints that will be applied when autoscaling with Unschedulable Pods policy. (see below for nested schema)'
            node_downscaler: '(Block List, Max: 1) node downscaler defines policies for removing nodes based on the configured conditions. (see below for nested schema)'
            node_grace_period_minutes: (Number) configure the node grace period which controls the duration which must pass after a node has been created before Evictor starts considering that node.
            node_templates_partial_matching_enabled: (Boolean) marks whether partial matching should be used when deciding which custom node template to select.
            pod_eviction_failure_back_off_interval: (String) configure the pod eviction failure back off interval. If pod eviction fails then Evictor will attempt to evict it again after the amount of time specified here.
            pod_pinner: '(Block List, Max: 1) defines the Cast AI Pod Pinner components settings. (see below for nested schema)'
            scoped_mode: (Boolean) enable/disable scoped mode. By default, Evictor targets all nodes in the cluster. This mode will constrain it to just the nodes which were created by CAST AI.
            spot_backup_restore_rate_seconds: (Number) defines interval on how often spot backups restore to real spot should occur.
            spot_backups: '(Block List, Max: 1, Deprecated) policy defining whether autoscaler can use spot backups instead of spot instances when spot instances are not available. (see below for nested schema)'
            spot_diversity_enabled: (Boolean, Deprecated) enable/disable spot diversity policy. When enabled, autoscaler will try to balance between diverse and cost optimal instance types.
            spot_diversity_price_increase_limit: (Number, Deprecated) allowed node configuration price increase when diversifying instance types. E.g. if the value is 10%, then the overall price of diversified instance types can be 10% higher than the price of the optimal configuration.
            spot_instances: '(Block List, Max: 1, Deprecated) policy defining whether autoscaler can use spot instances for provisioning additional workloads. (see below for nested schema)'
            spot_interruption_predictions: '(Block List, Max: 1, Deprecated) configure the handling of SPOT interruption predictions. (see below for nested schema)'
            spot_interruption_predictions_type: (String) define the type of the spot interruption prediction to handle. Allowed values are AWSRebalanceRecommendations, CASTAIInterruptionPredictions.
            timeouts: (Block, Optional) (see below for nested schema)
            unschedulable_pods: '(Block List, Max: 1) policy defining autoscaler''s behavior when unschedulable pods were detected. (see below for nested schema)'
            update: (String)
        importStatements: []
    castai_cache_configuration Resource - terraform-provider-castai:
        subCategory: ""
        description: Manage CAST AI DBO Cache Configuration. Cache configurations define caching behavior for specific databases within a cache group.
        name: castai_cache_configuration Resource - terraform-provider-castai
        title: castai_cache_configuration Resource - terraform-provider-castai
        argumentDocs:
            cache_group_id: (String) ID of the cache group this configuration belongs to.
            create: (String)
            database_name: (String) Logical database name to cache.
            delete: (String)
            id: (String) The ID of this resource.
            mode: '(String) Caching mode for this database. Valid values: Auto, DontCache, Manual.'
            read: (String)
            timeouts: (Block, Optional) (see below for nested schema)
            update: (String)
        importStatements: []
    castai_cache_group Resource - terraform-provider-castai:
        subCategory: ""
        description: Manage CAST AI DBO Cache Group. Cache groups enable query caching for database workloads.
        name: castai_cache_group Resource - terraform-provider-castai
        title: castai_cache_group Resource - terraform-provider-castai
        argumentDocs:
            create: (String)
            delete: (String)
            direct_mode: (Boolean) Enable direct mode for the cache group.
            endpoints: (Block List) Connection endpoints for the cache group. At least one endpoint is required when specified. (see below for nested schema)
            hostname: (String) Database instance hostname.
            id: (String) The ID of this resource.
            name: (String) Display name for the cache group.
            port: (Number) Database instance port.
            protocol_type: '(String) Database protocol type. Valid values: MySQL or PostgreSQL'
            read: (String)
            timeouts: (Block, Optional) (see below for nested schema)
            update: (String)
        importStatements: []
    castai_cache_rule Resource - terraform-provider-castai:
        subCategory: ""
        description: Manage CAST AI DBO Cache Rule (TTL Configuration). Cache rules define caching behavior and TTL settings for specific queries or tables within a cache configuration.
        name: castai_cache_rule Resource - terraform-provider-castai
        title: castai_cache_rule Resource - terraform-provider-castai
        argumentDocs:
            cache_configuration_id: (String) ID of the cache configuration this rule belongs to.
            cache_group_id: (String) ID of the cache group this rule belongs to.
            create: (String)
            delete: (String)
            id: (String) The ID of this resource.
            manual_ttl: (Number) TTL in seconds. Required when mode is Manual.
            mode: '(String) TTL mode for queries matching this rule. Valid values: Auto, DontCache, Manual.'
            read: (String)
            table: (String) Database table name to apply this rule to. Either table or template_hash must be specified.
            template_hash: (String) Hash of the query template. Either table or template_hash must be specified.
            timeouts: (Block, Optional) (see below for nested schema)
            update: (String)
        importStatements: []
    castai_commitments:
        subCategory: ""
        description: Commitments represent cloud service provider reserved instances (Azure) and commited use discounts (GCP) that can be used by CAST AI autoscaler.
        name: castai_commitments
        title: castai_commitments Resource - terraform-provider-castai
        examples:
            - name: gcp_test
              manifest: |-
                {
                  "commitment_configs": [
                    {
                      "allowed_usage": 0.6,
                      "assignments": [
                        {
                          "cluster_id": "cluster-id-1"
                        },
                        {
                          "cluster_id": "cluster-id-2"
                        }
                      ],
                      "matcher": [
                        {
                          "name": "test",
                          "region": "us-east4",
                          "type": "COMPUTE_OPTIMIZED_C2D"
                        }
                      ],
                      "prioritization": true,
                      "scaling_strategy": "Default",
                      "status": "Inactive"
                    }
                  ],
                  "gcp_cuds_json": "${file(\"./cuds.json\")}"
                }
            - name: azure_test
              manifest: |-
                {
                  "azure_reservations_csv": "${file(\"./reservations.csv\")}",
                  "commitment_configs": [
                    {
                      "allowed_usage": 0.9,
                      "assignments": [
                        {
                          "cluster_id": "cluster-id-3"
                        },
                        {
                          "cluster_id": "cluster-id-4"
                        }
                      ],
                      "matcher": [
                        {
                          "name": "test-res-1",
                          "region": "eastus",
                          "type": "Standard_D32as_v4"
                        }
                      ],
                      "prioritization": false,
                      "scaling_strategy": "Default",
                      "status": "Active"
                    }
                  ]
                }
            - name: team_a
              manifest: |-
                {
                  "azure_reservations_csv": "${file(\"./team-a-reservations.csv\")}",
                  "commitment_configs": [
                    {
                      "allowed_usage": 1,
                      "assignments": [
                        {
                          "cluster_id": "team-a-cluster-id"
                        }
                      ],
                      "auto_assignment": false,
                      "matcher": [
                        {
                          "name": "team-a-reservation",
                          "region": "eastus",
                          "type": "Standard_DS2_v2"
                        }
                      ],
                      "prioritization": false,
                      "scaling_strategy": "Default",
                      "status": "Active"
                    }
                  ],
                  "import_mode": "APPEND"
                }
        argumentDocs:
            allowed_usage: (Number) Allowed usage of the commitment. The value is between 0 (0%) and 1 (100%).
            assignments: (Block List) List of assigned clusters for the commitment. If prioritization is enabled, the order of the assignments indicates the priority. The first assignment has the highest priority. (see below for nested schema)
            auto_assignment: (Boolean) If enabled, the commitment is automatically assigned to all clusters in the matching region. When disabled, only explicitly listed cluster assignments are used.
            azure_reservations: (List of Object) List of Azure reservations. (see below for nested schema)
            azure_reservations_csv: (String) CSV file containing reservations exported from Azure.
            cluster_id: (String) ID of the cluster to assign the commitment to.
            commitment_configs: (Block List) List of commitment configurations. (see below for nested schema)
            count: (Number)
            cpu: (Number)
            create: (String)
            cud_id: (String)
            cud_status: (String)
            end_timestamp: (String)
            gcp_cuds: (List of Object) List of GCP CUDs. (see below for nested schema)
            gcp_cuds_json: (String) JSON file containing CUDs exported from GCP.
            id: (String) The ID of this resource.
            import_mode: (String) Import mode. OVERWRITE replaces all commitments for the CSP. APPEND upserts without deleting existing ones.
            instance_type: (String)
            matcher: '(Block List, Min: 1, Max: 1) Matcher used to map config to a commitment. (see below for nested schema)'
            memory_mb: (Number)
            name: (String) Name of the commitment to match.
            organization_id: (String) Organization ID. If not provided, will be fetched from the API using the authentication token.
            plan: (String)
            prioritization: (Boolean) If enabled, it's possible to assign priorities to the assigned clusters.
            priority: (Number) Priority of the assignment. The lower the value, the higher the priority. 1 is the highest priority.
            region: (String) Region of the commitment to match.
            reservation_id: (String)
            reservation_status: (String)
            scaling_strategy: '(String) Scaling strategy of the commitment in CAST AI. One of: Default, CPUBased, RamBased'
            scope: (String)
            scope_resource_group: (String)
            scope_subscription: (String)
            start_timestamp: (String)
            status: (String) Status of the commitment in CAST AI.
            timeouts: (Block, Optional) (see below for nested schema)
            type: (String) Type of the commitment to match. For compute resources, it's the type of the machine.
            update: (String)
        importStatements: []
    castai_edge_configuration Resource - terraform-provider-castai:
        subCategory: ""
        description: Manage CAST AI Edge Configuration for edge computing deployments
        name: castai_edge_configuration Resource - terraform-provider-castai
        title: castai_edge_configuration Resource - terraform-provider-castai
        argumentDocs:
            aws: (Attributes) AWS specific configuration (see below for nested schema)
            boot_disk_size_gib: (Number) Boot disk size in GiB
            cluster_id: (String) CAST AI cluster ID
            cri: (Attributes) CRI (Container Runtime Interface) configuration for the edge node. Set this when you want kubelet to connect to a container runtime you have set up explicitly on the node. Currently only containerd is officially supported. (see below for nested schema)
            custom: (Attributes) Custom cloud specific configuration (see below for nested schema)
            default: (Boolean) Whether this edge configuration is the default one
            edge_location_id: (String) Edge location ID
            gcp: (Attributes) GCP specific configuration (see below for nested schema)
            id: (String) Edge configuration ID
            image_id: (String) ImageID to be used for edge creation. It can be an AMI ID (for example 'ami-0abcdef1234567890') or a name filter (for example 'al2023-ami-ecs-hvm-*')
            labels: (Map of String) Instance/VM labels
            name: (String) Name of the edge configuration
            oci: (Attributes) OCI specific configuration (see below for nested schema)
            organization_id: (String) CAST AI organization ID
            socket: '(String) Path to an existing CRI socket. Example: unix:///run/containerd/containerd.sock'
            tags: (Map of String) Instance/VM tags
            user_data_base64: '(String) Base64 encoded user data to run on the edge as part of bootstrap. The payload must start with either #cloud-config (cloud-init YAML) or #! (shell script with a shebang)'
        importStatements: []
    castai_edge_configuration_default Resource - terraform-provider-castai:
