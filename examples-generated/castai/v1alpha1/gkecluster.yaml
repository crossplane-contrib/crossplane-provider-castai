apiVersion: castai.upbound.io/v1alpha1
kind: GkeCluster
metadata:
  annotations:
    meta.upbound.io/example-id: castai/v1alpha1/gkecluster
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    castaiServiceAccountEmail: ${data.castai_impersonation_service_account.this.email}
    deleteNodesOnDisconnect: ${var.delete_nodes_on_disconnect}
    location: ${module.gke.location}
    name: ${var.gke_cluster_name}
    projectId: ${var.project_id}
    targetServiceAccountEmail: ${google_service_account.target.email}
