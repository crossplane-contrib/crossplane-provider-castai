apiVersion: castai.upbound.io/v1alpha1
kind: RebalancingSchedule
metadata:
  annotations:
    meta.upbound.io/example-id: castai/v1alpha1/rebalancingschedule
  labels:
    testing.upbound.io/example-name: spots
  name: spots
spec:
  forProvider:
    launchConfiguration:
    - aggressiveModeConfig:
      - ignoreLocalPersistentVolumes: true
        ignoreProblemJobPods: true
        ignoreProblemPodsWithoutController: true
        ignoreProblemRemovalDisabledPods: true
      drainFailureConfig:
      - disableUncordon: false
        uncordonAfterSeconds: 7200
      executionConditions:
      - achievedSavingsPercentage: 10
        enabled: true
      keepDrainTimeoutNodes: true
      nodeTtlSeconds: 300
      numTargetedNodes: 3
      rebalancingMinNodes: 2
      selector: |-
        ${jsonencode({
              nodeSelectorTerms = [{
                matchExpressions = [
                  {
                    key      = "scheduling.cast.ai/spot"
                    operator = "Exists"
                  }
                ]
              }]
            })}
    name: rebalance spots at every 30th minute
    schedule:
    - cron: '*/30 * * * *'
    triggerConditions:
    - savingsPercentage: 20
