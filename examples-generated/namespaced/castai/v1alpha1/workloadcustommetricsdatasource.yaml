apiVersion: castai.m.upbound.io/v1alpha1
kind: WorkloadCustomMetricsDataSource
metadata:
  annotations:
    meta.upbound.io/example-id: castai/v1alpha1/workloadcustommetricsdatasource
  labels:
    testing.upbound.io/example-name: prometheus
  name: prometheus
  namespace: upbound-system
spec:
  forProvider:
    clusterId: ${castai_eks_cluster.this.id}
    name: my-prometheus
    prometheus:
    - presets:
      - jvm
      timeout: 30s
      url: http://prometheus-server.monitoring.svc.cluster.local:9090
