# Apply with real values:
#   ENTERPRISE_ID=<enterprise-org-id> ORGANIZATION_ID=<child-org-id> envsubst < enterpriseserviceaccount.yaml | kubectl apply -f -
# Omit organizationId to scope the service account to the enterprise organization itself.
apiVersion: castai.upbound.io/v1alpha1
kind: EnterpriseServiceAccount
metadata:
  name: sample
spec:
  forProvider:
    enterpriseId: ${ENTERPRISE_ID}
    organizationId: ${ORGANIZATION_ID}
    name: sample-enterprise-service-account
    description: "Service account managed by Crossplane in a child organization"
  providerConfigRef:
    name: default
